name: java-docker-buildx

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - master

env:
  IMAGE_NAME: products-api
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Run tests
        run: ./gradlew --no-daemon test

      - name: Validate Docker Hub credentials
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -eu
          test -n "${DOCKERHUB_USERNAME:-}"
          test -n "${DOCKERHUB_TOKEN:-}"
          test -n "${DOCKERHUB_NAMESPACE:-}"

      - name: Compute image tags
        id: meta
        run: |
          set -eu
          IMAGE="docker.io/${DOCKERHUB_NAMESPACE:-local}/${IMAGE_NAME}"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          echo "cache_ref=${IMAGE}:buildcache" >> "$GITHUB_OUTPUT"

          if echo "${GITHUB_REF:-}" | grep -Eq '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            BRANCH="$(echo "${GITHUB_REF_NAME:-dev}" | tr '/_' '-' | tr -cd '[:alnum:].-')"
            VERSION="${BRANCH}-${SHORT_SHA}"
          fi
          echo "tags=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Docker CLI
        run: |
          apt-get update
          apt-get install -y docker.io

      - name: Login to Docker Hub
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -eu
          echo "$DOCKERHUB_TOKEN" | docker login docker.io -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.cache_ref }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.cache_ref }},mode=max,ignore-error=true
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
