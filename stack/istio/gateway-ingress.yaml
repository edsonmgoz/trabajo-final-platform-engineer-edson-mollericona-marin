apiVersion: v1
kind: ConfigMap
metadata:
  name: ingress-gw-options
  namespace: istio-system
data:
  deployment: |
    spec:
      template:
        spec:
          nodeSelector:
            node: workloads
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ingress-public
  namespace: istio-system
spec:
  gatewayClassName: istio

  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: ingress-gw-options

  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: In
              values:
                - default
                - app
