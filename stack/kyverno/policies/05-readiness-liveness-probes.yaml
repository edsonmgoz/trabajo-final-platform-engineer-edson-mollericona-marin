apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: require-liveness-readiness-probes
  namespace: app
  annotations:
    policies.kyverno.io/title: Require liveness and readiness probes
    policies.kyverno.io/category: MitoCode Cloud Native
spec:
  validationFailureAction: Enforce
  background: true
  rules:

  - name: require-probes
    match:
      any:
      - resources:
          kinds:
          - Deployment
    validate:
      message: "Cada contenedor debe tener readinessProbe y livenessProbe."
      foreach:
      - list: "request.object.spec.template.spec.containers[]"
        deny:
          conditions:
            any:
            - key: "{{ element.readinessProbe || '' }}"
              operator: Equals
              value: ""
            - key: "{{ element.livenessProbe || '' }}"
              operator: Equals
              value: ""
