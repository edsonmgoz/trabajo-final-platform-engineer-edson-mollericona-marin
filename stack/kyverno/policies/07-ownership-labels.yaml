apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: require-ownership-labels
  namespace: app
  annotations:
    policies.kyverno.io/title: Require ownership labels
    policies.kyverno.io/category: MitoCode Cloud Native
spec:
  validationFailureAction: Enforce
  background: true
  rules:

  - name: require-deployment-ownership-labels
    match:
      any:
      - resources:
          kinds:
          - Deployment
    validate:
      message: "Deployment y Pod template deben declarar owner, environment y app.kubernetes.io/name."
      pattern:
        metadata:
          labels:
            owner: "?*"
            environment: "?*"
            app.kubernetes.io/name: "?*"
        spec:
          template:
            metadata:
              labels:
                owner: "?*"
                environment: "?*"
                app.kubernetes.io/name: "?*"
