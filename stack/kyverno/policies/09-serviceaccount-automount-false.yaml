apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: disable-serviceaccount-token-automount
  namespace: app
  annotations:
    policies.kyverno.io/title: Disable ServiceAccount token automount
    policies.kyverno.io/category: MitoCode Cloud Native
spec:
  validationFailureAction: Enforce
  background: true
  rules:

  - name: require-automount-false
    match:
      any:
      - resources:
          kinds:
          - ServiceAccount
    validate:
      message: "ServiceAccount debe declarar automountServiceAccountToken: false salvo excepción justificada."
      pattern:
        automountServiceAccountToken: false
