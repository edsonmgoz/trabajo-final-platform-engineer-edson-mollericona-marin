apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: block-plain-text-secret-env
  namespace: app
  annotations:
    policies.kyverno.io/title: Block plain text secrets in env vars
    policies.kyverno.io/category: MitoCode Cloud Native
spec:
  validationFailureAction: Enforce
  background: true
  rules:

  - name: require-secret-key-ref-for-sensitive-env
    match:
      any:
      - resources:
          kinds:
          - Deployment
    validate:
      message: "Variables con nombre sensible deben usar valueFrom.secretKeyRef."
      foreach:
      - list: "request.object.spec.template.spec.[initContainers, containers][].env[]"
        deny:
          conditions:
            all:
            - key: "{{ regex_match('(?i)(^|.*[_-])(password|passwd|token|secret|api[_-]?key|access[_-]?key|private[_-]?key|credential|credentials)$', element.name) }}"
              operator: Equals
              value: true
            - key: "{{ element.valueFrom.secretKeyRef || '' }}"
              operator: Equals
              value: ""
