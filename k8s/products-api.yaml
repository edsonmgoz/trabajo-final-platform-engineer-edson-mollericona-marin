apiVersion: v1
kind: ServiceAccount
metadata:
  name: products-api
  namespace: app
  labels:
    app.kubernetes.io/name: products-api
    backstage.io/kubernetes-id: products-api
  annotations:
    backstage.io/kubernetes-id: products-api
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-api
  namespace: app
  labels:
    app: products-api
    app.kubernetes.io/name: products-api
    owner: team-products
    environment: dev
    backstage.io/kubernetes-id: products-api
  annotations:
    backstage.io/kubernetes-id: products-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: products-api
  template:
    metadata:
      labels:
        app: products-api
        app.kubernetes.io/name: products-api
        owner: team-products
        environment: dev
        backstage.io/kubernetes-id: products-api
      annotations:
        instrumentation.opentelemetry.io/inject-java: "true"
        instrumentation.opentelemetry.io/container-names: server
        traffic.sidecar.istio.io/excludeOutboundPorts: "4317,4318"
        backstage.io/kubernetes-id: products-api
    spec:
      serviceAccountName: products-api
      terminationGracePeriodSeconds: 5
      nodeSelector:
        node: workloads
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: server
          image: docker.io/edsonmgoz/products-api:v0.1.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: products-api
  namespace: app
  labels:
    app: products-api
    app.kubernetes.io/name: products-api
    backstage.io/kubernetes-id: products-api
  annotations:
    backstage.io/kubernetes-id: products-api
spec:
  type: ClusterIP
  selector:
    app: products-api
  ports:
    - name: http
      appProtocol: http
      port: 8080
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: products-api-route
  namespace: app
  labels:
    backstage.io/kubernetes-id: products-api
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    backstage.io/kubernetes-id: products-api
spec:
  parentRefs:
    - name: ingress-public
      namespace: istio-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/products
      backendRefs:
        - name: products-api
          port: 8080
